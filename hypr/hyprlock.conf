# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(242, 143, 173, 0.85)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}
# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(242, 143, 173, 0.90)
    font_size = 120
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = center
}
