# BACKGROUND
background {
    monitor =
    path = ~/Pictures/mando.jpg
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}
# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}
