# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(242, 143, 173, 0.5)
    inner_color = rgba(242, 143, 173, 0.10)
    font_color = rgb(242, 143, 173)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##f28fad99">    Enter Pass</span></i>
    hide_input = false
    # position = 0, -210
    position = 0, -150
    halign = center
    valign = center
}
# CURRENT SONG
label {
    monitor =
    text = Tenjō Tenge Yui Ga Dokuson
    color = rgba(242, 143, 173, 0.70)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = bottom
}
